[build]
  command = "npm run build"
  publish = "dist"

# Netlify 비밀값 검사 예외 (검사 자체는 켜 둔다).
# 아래 값들은 브라우저에 공개되도록 설계된 값이라 빌드 결과물에 들어가는 것이 정상이다.
# - 관리자 이메일: 화면 접근 제한용. 실제 보호는 Firestore 규칙과 서버 토큰 검증이 담당.
# - Firebase 웹 API 키: 프로젝트 식별자일 뿐 비밀값이 아님(데이터 보호는 보안 규칙).
# OpenAI·뉴스 API 키, 서비스 계정 등 진짜 비밀값은 여기에 절대 추가하지 않는다.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAILS,VITE_ADMIN_EMAILS,VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyB3yMiNTBEtO8lkXLnpZeg0h8bhMyotQ3s"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA 라우팅: 모든 경로를 index.html로
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 검색엔진 노출 방지 및 기본 보안 헤더
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
